<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 监视</title>
  <style>
    :root {
      --paper: #e4ebf0;
      --ink: #17202a;
      --muted: #5e6e7a;
      --line: #c9d5de;
      --panel: #f6f9fa;
      --ai: #1e4d78;
      --politics: #8e3b32;
      --fun: #1f6b52;
      --focus: #17202a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Palatino Linotype", Palatino, serif;
      min-height: 100vh;
    }
    button, select { font: inherit; color: inherit; }
    a { color: inherit; }
    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 22px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    .day {
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 92px;
      line-height: 0.8;
      letter-spacing: -0.04em;
      margin: 0;
    }
    .day-meta {
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 18px;
      margin: 0 0 8px;
    }
    h1 {
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .fetched {
      margin: 4px 0 0;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .method {
      grid-column: 2;
      margin: 0;
      max-width: 62ch;
      line-height: 1.45;
      color: var(--muted);
      font-size: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      align-items: flex-end;
      justify-content: space-between;
      margin: 18px 0 8px;
    }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; }
    .preset {
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 8px 2px 10px;
      margin-right: 16px;
      cursor: pointer;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 20px;
    }
    .preset[aria-selected="true"] { border-bottom-color: var(--lane); }
    .preset:focus-visible, .window button:focus-visible, .post:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .window { display: flex; gap: 6px; }
    .window button {
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 10px;
      cursor: pointer;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--muted);
    }
    .window button[aria-pressed="true"] {
      color: var(--ink);
      border-color: var(--ink);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 36px;
      margin-top: 8px;
    }
    .lane-line {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 68ch;
      line-height: 1.45;
    }
    .post {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 12px 14px;
      padding: 18px 0 18px 14px;
      border-top: 1px solid var(--line);
      border-left: 3px solid var(--lane);
      text-decoration: none;
    }
    .post:hover { background: var(--panel); }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--line);
    }
    .who {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
    }
    .name { font-size: 16px; }
    .handle { color: var(--muted); font-weight: 400; }
    .heat {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    .why {
      margin: 2px 0 0;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .text {
      margin: 8px 0 0;
      font-size: 18px;
      line-height: 1.45;
      max-width: 68ch;
    }
    .when {
      margin: 8px 0 0;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }
    .shot {
      margin-top: 10px;
      width: min(100%, 420px);
      max-height: 220px;
      object-fit: cover;
      display: block;
    }
    .empty {
      padding: 22px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
    .older-label {
      margin: 28px 0 0;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 16px;
    }
    aside h2 {
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin: 22px 0 8px;
    }
    .side-link {
      display: block;
      text-decoration: none;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-size: 15px;
      line-height: 1.35;
    }
    .side-link span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .miss {
      margin-top: 28px;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    @media (max-width: 800px) {
      .day { font-size: 72px; }
      header, .layout { grid-template-columns: 1fr; }
      .method { grid-column: 1; }
      .layout { gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="day" id="day">--</p>
      <div>
        <p class="day-meta" id="day-meta"></p>
        <h1>X 监视</h1>
        <p class="fetched" id="fetched"></p>
      </div>
      <p class="method">每天看三栏：AI 帖、世界政治、其他好玩的帖。帖来自固定名单的公开时间线，近窗里按互动挑。点开进入 X。</p>
    </header>
    <div class="controls">
      <div class="presets" id="presets" role="tablist"></div>
      <div class="window" id="window" role="group" aria-label="时间窗"></div>
    </div>
    <div class="layout">
      <main id="main"></main>
      <aside id="aside"></aside>
    </div>
    <p class="miss" id="miss"></p>
  </div>
  <script src="data.js"></script>
  <script>
    const COLORS = { ai: "#1e4d78", politics: "#8e3b32", fun: "#1f6b52" };
    const WINDOWS = [
      { id: "24", hours: 24, label: "24 小时" },
      { id: "72", hours: 72, label: "3 天" },
      { id: "168", hours: 168, label: "7 天" },
    ];
    const board = window.XWATCH;
    const state = { lane: "ai", hours: 72 };

    function ageHours(iso, now) {
      return (now - Date.parse(iso)) / 36e5;
    }

    function score(post, now) {
      const eng = post.fav + post.rt * 4 + post.reply * 2 + post.quote * 3;
      const rate = eng / Math.max(post.followers || 1000, 1000);
      const recency = Math.exp(-ageHours(post.created, now) / 36);
      const substance = Math.min(post.text.length, 220) / 220;
      return rate * recency * (0.35 + 0.65 * substance);
    }

    function inWindow(post, now) {
      const age = ageHours(post.created, now);
      return age >= 0 && age <= state.hours;
    }

    function ranked(posts, now) {
      const picked = posts.filter((post) => inWindow(post, now));
      const perHandle = new Map();
      return picked
        .slice()
        .sort((a, b) => score(b, now) - score(a, now))
        .filter((post) => {
          const n = perHandle.get(post.handle) || 0;
          if (n >= 2) return false;
          perHandle.set(post.handle, n + 1);
          return true;
        })
        .slice(0, 12);
    }

    function fmtHeat(post) {
      const n = post.fav + post.rt;
      if (n >= 10000) return (n / 10000).toFixed(1) + " 万互动";
      if (n >= 1000) return (n / 1000).toFixed(1) + " 千互动";
      return n + " 互动";
    }

    function fmtWhen(iso, now) {
      const age = ageHours(iso, now);
      if (age < 1) return Math.max(1, Math.round(age * 60)) + " 分钟前";
      if (age < 24) return Math.round(age) + " 小时前";
      if (age < 48) return "昨天";
      const d = new Date(iso);
      return d.getMonth() + 1 + "月" + d.getDate() + "日";
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === "text") node.textContent = value;
        else if (key === "html") node.innerHTML = value;
        else node.setAttribute(key, value);
      }
      for (const child of children || []) node.append(child);
      return node;
    }

    function postNode(post, now) {
      const link = el("a", { class: "post", href: post.link, target: "_blank", rel: "noopener" });
      const img = el("img", { class: "avatar", alt: "", src: post.avatar || "" });
      const body = el("div");
      const who = el("div", { class: "who" });
      who.append(
        el("div", { class: "name", text: post.name + "  " }),
        el("div", { class: "heat", text: fmtHeat(post) })
      );
      who.querySelector(".name").append(el("span", { class: "handle", text: "@" + post.handle }));
      body.append(who, el("p", { class: "why", text: post.why }), el("p", { class: "text", text: post.text }));
      if (post.photo) body.append(el("img", { class: "shot", alt: "", src: post.photo }));
      body.append(el("p", { class: "when", text: fmtWhen(post.created, now) }));
      link.append(img, body);
      return link;
    }

    function render() {
      if (!board) {
        document.getElementById("fetched").textContent = "还没有数据。双击 刷新.bat。";
        return;
      }
      const now = Date.now();
      const fetched = new Date(board.fetchedAt);
      document.getElementById("day").textContent = String(fetched.getDate());
      document.getElementById("day-meta").textContent =
        fetched.getFullYear() + "年" + (fetched.getMonth() + 1) + "月  " +
        "周" + "日一二三四五六"[fetched.getDay()];
      const staleH = (now - fetched.getTime()) / 36e5;
      document.getElementById("fetched").textContent =
        "名单拉取于 " +
        fetched.getHours() + ":" + String(fetched.getMinutes()).padStart(2, "0") +
        (staleH > 18 ? "。已超过 18 小时，双击 刷新.bat 再拉一次。" : "。");

      const presets = document.getElementById("presets");
      presets.replaceChildren();
      for (const lane of board.lanes) {
        const count = ranked(lane.posts, now).length;
        const btn = el("button", {
          class: "preset",
          role: "tab",
          type: "button",
          "aria-selected": state.lane === lane.id ? "true" : "false",
          text: lane.title + "  " + count,
        });
        btn.style.setProperty("--lane", COLORS[lane.id]);
        btn.addEventListener("click", () => {
          state.lane = lane.id;
          render();
        });
        presets.append(btn);
      }

      const windows = document.getElementById("window");
      windows.replaceChildren();
      for (const item of WINDOWS) {
        const btn = el("button", {
          type: "button",
          "aria-pressed": state.hours === item.hours ? "true" : "false",
          text: item.label,
        });
        btn.addEventListener("click", () => {
          state.hours = item.hours;
          render();
        });
        windows.append(btn);
      }

      const lane = board.lanes.find((item) => item.id === state.lane);
      document.documentElement.style.setProperty("--lane", COLORS[lane.id]);
      const main = document.getElementById("main");
      const posts = ranked(lane.posts, now);
      const nodes = [el("p", { class: "lane-line", text: lane.line })];
      if (!posts.length) {
        nodes.push(el("p", { class: "empty", text: "这个时间窗里，名单上没有新帖。" }));
        if (state.hours < 168 && lane.older?.length) {
          nodes.push(el("p", { class: "older-label", text: "近两周里还有人转的帖" }));
          for (const post of lane.older.slice(0, 4)) nodes.push(postNode(post, now));
        }
      } else {
        for (const post of posts) nodes.push(postNode(post, now));
      }
      main.replaceChildren(...nodes);

      const aside = document.getElementById("aside");
      const side = [];
      for (const other of board.lanes.filter((item) => item.id !== lane.id)) {
        side.push(el("h2", { text: other.title }));
        const tops = ranked(other.posts, now).slice(0, 4);
        if (!tops.length) {
          side.push(el("p", { class: "why", text: "这个时间窗是空的。" }));
          continue;
        }
        for (const post of tops) {
          const a = el("a", { class: "side-link", href: post.link, target: "_blank", rel: "noopener" });
          a.append(document.createTextNode(post.text.length > 72 ? post.text.slice(0, 72) + "…" : post.text));
          a.append(el("span", { text: post.name + "  " + fmtWhen(post.created, now) }));
          side.push(a);
        }
      }
      aside.replaceChildren(...side);

      const miss = document.getElementById("miss");
      if (board.errors?.length) {
        miss.textContent = "这次没读到：" + board.errors.map((item) => "@" + item.handle).join(" ");
      } else {
        miss.textContent = "双击 刷新.bat 可立刻重拉。每天 7:00 也会自动拉，电脑开着才会跑。";
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea")) return;
      const order = ["ai", "politics", "fun"];
      const n = Number(event.key);
      if (n >= 1 && n <= 3) {
        state.lane = order[n - 1];
        render();
      }
    });

    render();
  </script>
</body>
</html>
