<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 监视</title>
  <style>
    :root {
      --paper: #e4ebf0;
      --ink: #17202a;
      --muted: #5e6e7a;
      --line: #c9d5de;
      --panel: #f4f8f9;
      --ai: #1e4d78;
      --politics: #8e3b32;
      --fun: #1f6b52;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Palatino Linotype", Palatino, serif;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; background: transparent; }
    .wrap {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 48px;
    }
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 6px 22px;
      align-items: end;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .day {
      margin: 0;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 64px;
      line-height: 0.8;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 0;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .fetched, .day-meta {
      margin: 2px 0 0;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .window { display: flex; gap: 6px; align-self: end; }
    .window button {
      border: 1px solid transparent;
      padding: 6px 10px;
      cursor: pointer;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--muted);
    }
    .window button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
    .window button:focus-visible, .post:focus-visible, .col-title:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      margin-top: 18px;
    }
    .col { min-width: 0; }
    .col-title {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-top: 3px solid var(--lane);
      padding: 10px 0 0;
      cursor: pointer;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 18px;
    }
    .lead {
      margin: 8px 0 0;
      font-size: 17px;
      line-height: 1.4;
    }
    .post {
      display: block;
      text-decoration: none;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .post:hover { background: var(--panel); }
    .post.lead-post { padding-top: 16px; }
    .who {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }
    .zh {
      margin: 6px 0 0;
      font-size: 17px;
      line-height: 1.4;
    }
    .clip {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lead-post .zh { font-size: 20px; }
    .en {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty { color: var(--muted); padding: 16px 0; border-top: 1px solid var(--line); }
    .miss {
      margin: 22px 0 0;
      color: var(--muted);
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    @media (max-width: 900px) {
      header { grid-template-columns: auto 1fr; }
      .window { grid-column: 1 / -1; }
      .board { grid-template-columns: 1fr; }
      .day { font-size: 52px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="day" id="day">--</p>
      <div>
        <h1>X 监视</h1>
        <p class="day-meta" id="day-meta"></p>
        <p class="fetched" id="fetched"></p>
      </div>
      <div class="window" id="window" role="group" aria-label="时间窗"></div>
    </header>
    <div class="board" id="board"></div>
    <p class="miss" id="miss"></p>
  </div>
  <script src="data.js"></script>
  <script>
    const COLORS = { ai: "#1e4d78", politics: "#8e3b32", fun: "#1f6b52" };
    const WINDOWS = [
      { hours: 24, label: "24 小时" },
      { hours: 72, label: "3 天" },
      { hours: 168, label: "7 天" },
    ];
    const NOTES = {
      "2108680150556737819": "Claude 会在真网站上绕开限制继续操作。Anthropic 说影响很小，但以后会更频繁地公开这类行为。",

      "2108216753604248000": "微软放出跨平台沙箱库，Windows、macOS、Linux 都能用。",
      "2108547065634844839": "Simon Willison 边做饭边用语音让 Codex 给博客加了一个功能。",
      "2108302539498414208": "Anthropic 启动 Cyber Mission，要把关键基础设施和开源软件的安全补上。",
      "2108414247558316508": "急诊场景里，旧版 Gemini 的建议被其他医生打分，质量和医生差不多，没看到安全问题。",
      "2107924408597950702": "ChatGPT 现在可以按你的要求生成一个定制界面。",
      "2107909792945832070": "OpenAI 在做面向 18 岁以下的 ChatGPT，并预览了大学申请规划工具。",
      "2107861788301607261": "Demis Hassabis 说，眼下最该把 AI 用在医学和健康上，并宣布了和 CZI 的合作。",
      "2107834249680499136": "谷歌的 SynthID 检测器对所有人开放，用来分辨内容是不是 AI 生成的。",
      "2108660476020420855": "特朗普用增购俄罗斯柴油来压价格。作者认为这是暂停情报共享之后，对乌克兰最重的一击。",
      "2108659926168191423": "泽连斯基说，放行俄罗斯柴油出口是“强伙伴的弱决定”，等于给战争多一笔收入。",
      "2108785177648394322": "10 月 10 日凌晨，俄军制导炸弹打中扎波罗热一栋五层住宅，4 死 4 伤。",
      "2108924826836435273": "搜救还在继续。基辅独立报更新：俄军袭击已造成乌克兰至少 19 死、39 伤。",
      "2108667513374732748": "从美国到中国租一艘油轮，现在比把火箭送上太空还贵。",
      "2108828044961968293": "新德里拘留了数千名抗议者。“蟑螂”青年运动在反对选民名单修订。",
      "2108841514591809738": "大规模抗议前，印度警方逮捕了“蟑螂”运动的领导人。",
      "2108923242568175805": "利雅得机场再次遇袭。官员称机场已疏散，空中交通停了。",
      "2108810927889870893": "机场遇袭之后，沙特几场旗舰峰会的举办受到压力。",
      "2108900390250934375": "经济学人：俄罗斯正在加大在欧洲的破坏活动，核威胁也越来越离谱。",
      "2108772385902014795": "特朗普批评挪威诺贝尔和平奖的决定，称这是“国家的污点”。",
      "2108740524442280200": "美国、乌克兰和欧洲官员在迈阿密开会，讨论如何结束俄罗斯的战争。",
      "2108662426606395572": "韦伯望远镜用红外看穿星云尘埃，拍到不同年龄的小恒星。",

      "2108244617514680570": "哈勃用可见光和近红外看创生之柱。不同波长穿过气体和尘埃，看到的东西不一样。",
      "2108618999546122669": "星系对 Arp 143 撞过一次，右边那团因此正在大量生星。",
      "2108558099925619110": "科学家在霸王龙的粪便化石里发现一根羽毛，这是粪化石里的第一次。",
      "2108871915771134359": "欧洲航天局宇航员 Sophie 在空间站待了近八个月，今天回到欧洲，接下来在科隆做恢复和科研。",
      "2109056389285085519": "宾夕法尼亚州伊利市，一名男子在家中打死八人，其中包括一名孕妇和几名儿童，随后自杀。",
      "2109052606144282963": "马拉维首都利隆圭燃油短缺，有人排队三天等汽油，有人睡在车里。",
      "2109041282345525731": "利雅得哈立德国王国际机场本周三度遇袭，民航局称有人受伤。",
      "2109042649982509216": "也门胡塞武装公布无人机视频，称正在打击沙特支持的也门政府军。",
      "2109039927279436261": "沙特领导的联盟说，一枚弹体落在达曼法赫德国王国际机场附近。",
      "2109047791922332003": "巴勒斯坦外交部谴责对利雅得机场和沙特的袭击。",
      "2108965790670295385": "有人用特殊透镜浴房，让站在里面的妻子看起来消失了。",
      "2108950692245156152": "鹦鹉丢了喙，主人给它打印了一个假喙。",
      "2108960750706290963": "阿姆斯特丹每年从运河里捞上大约一万两千到一万五千辆自行车。",
      "2109048834135597370": "你难过的时候可以想想：体内一种叫驱动蛋白的小东西，正一刻不停地干活，你才活着。",
      "2109045056225390707": "这个年轻人上了战场，回来时变了很多，女朋友没有离开他。",
    };
    const board = window.XWATCH;
    const state = { hours: 72 };

    function ageHours(iso, now) {
      return (now - Date.parse(iso)) / 36e5;
    }

    function isPromo(post) {
      return /tix will sell out|last call to join|comp package/i.test(post.text);
    }

    function isSport(post) {
      return /soccer|tennis|ronaldo|\bopen final\b|verstappen|grand prix/i.test(post.text);
    }

    function hasSubstance(post) {
      return Boolean(NOTES[post.id]) || post.text.length >= 160;
    }

    function score(post, now) {
      const eng = post.fav + post.rt * 4 + post.reply * 2 + post.quote * 3;
      const rate = eng / Math.max(post.followers || 1000, 1000);
      const recency = Math.exp(-ageHours(post.created, now) / 18);
      const thin = post.text.length < 80 && !NOTES[post.id] ? 0.2 : 1;
      return rate * recency * thin * (isPromo(post) ? 0.05 : 1);
    }

    function ranked(posts, now, laneId) {
      const eligible = posts.filter((post) => {
        const age = ageHours(post.created, now);
        return age >= 0 && age <= state.hours && !isPromo(post) && hasSubstance(post);
      });
      const perHandle = new Map();
      const used = new Set();
      function take(list, limit, handleCap) {
        const out = [];
        for (const post of list) {
          if (out.length >= limit) break;
          if (used.has(post.id)) continue;
          const n = perHandle.get(post.handle) || 0;
          if (n >= handleCap) continue;
          perHandle.set(post.handle, n + 1);
          used.add(post.id);
          out.push(post);
        }
        return out;
      }
      let fresh = [];
      if (laneId === "politics" || laneId === "fun") {
        const pool = eligible
          .filter((post) => ageHours(post.created, now) <= 16 && post.text.length >= 70 && !(laneId === "politics" && isSport(post)))
          .sort((a, b) => Date.parse(b.created) - Date.parse(a.created));
        const byHandle = new Map();
        for (const post of pool) {
          const list = byHandle.get(post.handle) || [];
          if (list.length < 6) list.push(post);
          byHandle.set(post.handle, list);
        }
        const queues = [...byHandle.values()];
        const each = queues.length <= 2 ? 5 : 2;
        for (let i = 0; i < each && fresh.length < 8; i++) {
          for (const queue of queues) {
            if (fresh.length >= 8) break;
            if (!queue[i] || used.has(queue[i].id)) continue;
            fresh.push(queue[i]);
            used.add(queue[i].id);
            perHandle.set(queue[i].handle, (perHandle.get(queue[i].handle) || 0) + 1);
          }
        }
      }
      const rest = eligible
        .filter((post) => !used.has(post.id))
        .sort((a, b) => score(b, now) - score(a, now));
      let picked = fresh.concat(take(rest, 14 - fresh.length, 3));
      if (laneId === "ai" && state.hours >= 72 && picked.length < 14) {
        const older = posts
          .filter((post) => {
            const age = ageHours(post.created, now);
            return age > state.hours && age <= 168 && !isPromo(post) && hasSubstance(post) && !used.has(post.id);
          })
          .sort((a, b) => score(b, now) - score(a, now));
        picked = picked.concat(take(older, 14 - picked.length, 3));
      }
      return picked;
    }

    function fmtHeat(post) {
      const n = post.fav + post.rt;
      if (n >= 10000) return (n / 10000).toFixed(1) + " 万";
      if (n >= 1000) return (n / 1000).toFixed(1) + " 千";
      return String(n);
    }

    function fmtWhen(iso, now) {
      const age = ageHours(iso, now);
      if (age < 1) return Math.max(1, Math.round(age * 60)) + " 分钟前";
      if (age < 24) return Math.round(age) + " 小时前";
      if (age < 48) return "昨天";
      const d = new Date(iso);
      return d.getMonth() + 1 + "月" + d.getDate() + "日";
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) {
        if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children || []) node.append(child);
      return node;
    }

    function postNode(post, now, isLead) {
      const link = el("a", {
        class: isLead ? "post lead-post" : "post",
        href: post.link,
        target: "_blank",
        rel: "noopener",
      });
      const who = el("div", { class: "who" });
      who.append(
        el("span", { text: "@" + post.handle + "  " + post.why }),
        el("span", { text: fmtHeat(post) + "  " + fmtWhen(post.created, now) })
      );
      link.append(who);
      const note = NOTES[post.id];
      if (note) link.append(el("p", { class: "zh", text: note }));
      const en = el("p", { class: note ? "en" : "zh clip", text: post.text });
      link.append(en);
      return link;
    }

    function render() {
      const now = Date.now();
      const fetched = new Date(board.fetchedAt);
      document.getElementById("day").textContent = String(fetched.getDate());
      document.getElementById("day-meta").textContent =
        fetched.getFullYear() + "年" + (fetched.getMonth() + 1) + "月  周" + "日一二三四五六"[fetched.getDay()];
      const staleH = (now - fetched.getTime()) / 36e5;
      document.getElementById("fetched").textContent =
        "拉取于 " + fetched.getHours() + ":" + String(fetched.getMinutes()).padStart(2, "0") +
        (staleH > 18 ? "，已超过 18 小时" : "");

      const windows = document.getElementById("window");
      windows.replaceChildren();
      for (const item of WINDOWS) {
        const btn = el("button", {
          type: "button",
          "aria-pressed": state.hours === item.hours ? "true" : "false",
          text: item.label,
        });
        btn.addEventListener("click", () => {
          state.hours = item.hours;
          render();
        });
        windows.append(btn);
      }

      const boardEl = document.getElementById("board");
      const cols = board.lanes.map((lane) => {
        const posts = ranked(lane.posts, now, lane.id);
        const col = el("section", { class: "col", id: "lane-" + lane.id });
        col.style.setProperty("--lane", COLORS[lane.id]);
        const title = el("button", { class: "col-title", type: "button", text: lane.title + "  " + posts.length });
        title.addEventListener("click", () => {
          state.hours = state.hours;
          document.getElementById("lane-" + lane.id).scrollIntoView({ block: "start" });
        });
        col.append(title);
        if (!posts.length) {
          col.append(el("p", { class: "empty", text: "这个时间窗里没有新帖。" }));
          return col;
        }
        posts.forEach((post, index) => col.append(postNode(post, now, index === 0)));
        return col;
      });
      boardEl.replaceChildren(...cols);

      const miss = document.getElementById("miss");
      const failed = (board.errors || []).map((item) => "@" + item.handle);
      miss.textContent = failed.length
        ? "这次没读到 " + failed.join(" ")
        : "点开进 X。本地每天 7:00 重拉，公网要再推一次才更新。";
    }

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea")) return;
      const n = Number(event.key);
      if (n >= 1 && n <= 3) {
        const lane = board.lanes[n - 1];
        document.getElementById("lane-" + lane.id).scrollIntoView({ block: "start" });
      }
    });

    render();
  </script>
</body>
</html>
